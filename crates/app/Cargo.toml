[package]
name = "cascade-app"
description = "Native window, texture renderer, and debug overlay for Cascade"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
allocation-diagnostics = ["dep:stats_alloc"]

[dependencies]
cascade-sim = { path = "../sim" }
stats_alloc = { version = "0.1.10", optional = true }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
toml = "0.9"
wgpu = "30.0.1"
winit = "0.30.13"

[lints]
workspace = true
