name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build simulation WebAssembly module
        run: wasm-pack build crates/web --target web --release --out-dir ../../docs/tour/wasm --no-typescript
      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.5.4
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/mdbook.tar.gz"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build documentation in place
        run: |
          mdbook build
          # Root sources also copy non-Markdown files. Keep only book content and assets.
          rm -rf book/.git book/.github book/target book/node_modules book/crates book/scenarios book/profiles book/scripts
          rm -f book/.gitignore book/.DS_Store book/AGENTS.md book/CLAUDE.md book/Cargo.toml book/Cargo.lock book/rust-toolchain.toml book/package.json book/package-lock.json
          rm -f book/docs/tour/wasm/.gitignore book/docs/tour/wasm/package.json
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
